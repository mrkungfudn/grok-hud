# Isolated tmux chrome for grok-hud. Loaded with `tmux -f` so it does NOT
# touch ~/.tmux.conf or other tmux servers (herdr, claude-swarm, …).
#
# Grok has no statusLine API. Five status rows under the TUI:
#   [0] host · repo · branch* · dirty
#   [1] [model ◑ effort] · mode · title · live · ver · perm
#   [2] Context bar · time · turns · tools · files · lines
#   [3] Usage / weekly credits · sandbox · compact · err
#   [4] recent tools

set -g status 5
set -g status-position bottom
set -g status-interval 1
set -g status-left ""
set -g status-right ""
set -g status-left-length 0
set -g status-right-length 0
# Grok paints the alt-screen near-black. `bg=default` follows the iTerm
# profile (Tokyo Night gray ~#282a36) so the HUD band looks washed-out.
# Pin the same black as the TUI so the footer is flush with Grok.
set -g status-style "bg=#000000,fg=default"
set -g status-bg "#000000"

set -g status-format[0] '#[bg=#000000,fg=default,align=left]#(exec "$HOME/.grok/plugins/grok-hud/status-line.sh" 1 "#{pane_current_path}" "#{pane_pid}")'
set -g status-format[1] '#[bg=#000000,fg=default,align=left]#(exec "$HOME/.grok/plugins/grok-hud/status-line.sh" 2 "#{pane_current_path}" "#{pane_pid}")'
set -g status-format[2] '#[bg=#000000,fg=default,align=left]#(exec "$HOME/.grok/plugins/grok-hud/status-line.sh" 3 "#{pane_current_path}" "#{pane_pid}")'
set -g status-format[3] '#[bg=#000000,fg=default,align=left]#(exec "$HOME/.grok/plugins/grok-hud/status-line.sh" 4 "#{pane_current_path}" "#{pane_pid}")'
set -g status-format[4] '#[bg=#000000,fg=default,align=left]#(exec "$HOME/.grok/plugins/grok-hud/status-line.sh" 5 "#{pane_current_path}" "#{pane_pid}")'

set -g prefix None
unbind C-b

set -g escape-time 0
set -g mouse on
set -g set-clipboard on
set -wg allow-passthrough on
set -as terminal-features ",*:RGB"
set -g default-terminal "tmux-256color"
set -g remain-on-exit off
set -g destroy-unattached off
