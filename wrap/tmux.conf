# Isolated tmux chrome for grok-hud. Loaded with `tmux -f` so it does NOT
# touch ~/.tmux.conf or other tmux servers (herdr, claude-swarm, ...).
# English-only comments.
#
# Grok has no statusLine API. Five status rows under the TUI:
#   [0] host · repo · branch* · dirty
#   [1] [model ◑ effort] · mode · title · live · ver · perm
#   [2] Context bar · time · turns · tools · files · lines
#   [3] Usage / weekly credits · sandbox · compact · err
#   [4] recent tools

set -g status 5
set -g status-position bottom
set -g status-interval 1
set -g status-left ""
set -g status-right ""
set -g status-left-length 0
set -g status-right-length 0
# Fallback GrokNight bg_base. launch.sh / status-line.sh overwrite this from
# the live Grok theme (groknight / grokday / tokyonight / auto) so light mode
# is not stuck on black. Do NOT use bg=default — that is the iTerm profile
# (#282a36), not Grok's painted canvas.
set -g status-style "bg=#0a0a0a,fg=default"
set -g status-bg "#0a0a0a"

set -g status-format[0] '#[align=left]#(exec "$HOME/.grok/plugins/grok-hud/status-line.sh" 1 "#{pane_current_path}" "#{pane_pid}")'
set -g status-format[1] '#[align=left]#(exec "$HOME/.grok/plugins/grok-hud/status-line.sh" 2 "#{pane_current_path}" "#{pane_pid}")'
set -g status-format[2] '#[align=left]#(exec "$HOME/.grok/plugins/grok-hud/status-line.sh" 3 "#{pane_current_path}" "#{pane_pid}")'
set -g status-format[3] '#[align=left]#(exec "$HOME/.grok/plugins/grok-hud/status-line.sh" 4 "#{pane_current_path}" "#{pane_pid}")'
set -g status-format[4] '#[align=left]#(exec "$HOME/.grok/plugins/grok-hud/status-line.sh" 5 "#{pane_current_path}" "#{pane_pid}")'

# Forward Grok's OSC 0 pane title to the outer terminal. Herdr is not tmux;
# it detects grok idle/working from OSC titles. Without this, argv0 is `tmux`
# and the 5 HUD rows cover Grok's footer, so herdr's screen rules miss too.
set -g set-titles on
set -g set-titles-string '#T'

set -g prefix None
unbind C-b

set -g escape-time 0
set -g mouse on
set -g set-clipboard on
set -wg allow-passthrough on
set -as terminal-features ",*:RGB"
set -g default-terminal "tmux-256color"
set -g remain-on-exit off
set -g destroy-unattached off
